<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hackathon portal</title>

    <!-- Fonts: Archivo (headings), Inter (body), JetBrains Mono (labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- All visuals live here. -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="portal">
    <!-- Hover sidebar (profile, event switcher, theme, log in/out). Filled by drawSidebar(). -->
    <aside class="sidebar" id="sidebar" aria-label="Profile and settings"></aside>

    <div class="app" id="app">
      <header class="site-header" id="site-header">
        <!-- 1. Banner. Filled by drawBanner(). -->
        <section class="banner" id="banner" aria-label="Event banner"></section>
        <!-- 2. Main menu. Filled by drawNav(). -->
        <nav class="topnav" id="main-nav" aria-label="Main menu"></nav>
      </header>

      <!-- 3. Divider line. -->
      <div class="divider" aria-hidden="true"></div>

      <!-- Broadcast bar (dismissible). Filled by drawBroadcast(). -->
      <div class="broadcast text-mono" id="broadcast" role="status"></div>

      <main class="app__main" id="main">
        <!-- 4. Toolbar, countdown and Time box. Filled by drawPageHeader(). -->
        <section class="page-header" id="page-header" aria-label="Page header and countdown"></section>
        <!-- 5. Active page content. Filled by drawPage(). -->
        <section class="page" id="page"></section>
      </main>
    </div>

    <!-- Floating Mini Q&A bubble. Filled by drawQA(). -->
    <aside class="qa-widget" id="qa-widget" aria-label="Mini Q&amp;A"></aside>

    <script src="script.js" defer></script>
  </body>
</html>
