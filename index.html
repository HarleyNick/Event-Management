<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the full phone screen; styles.css keeps content clear of notches. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hackathon portal</title>

    <!-- Fonts: Archivo (headings), Inter (body text), JetBrains Mono (small labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- All visual design lives in styles.css -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body id="body">
    <!-- STRUCTURE ONLY. script.js fills every empty container below by its id. -->

    <!-- Hover sidebar: logo, profile, event switcher, theme toggle, log in/out -->
    <aside class="sidebar" id="sidebar" aria-label="Profile and settings"></aside>

    <div class="app" id="app">
      <!-- 1. Event banner (picture, title, location, date) -->
      <header class="banner" id="banner"></header>

      <!-- 2. Main navigation: one tab per page the signed-in role may open -->
      <nav class="top-nav" id="topNav" aria-label="Main menu"></nav>

      <!-- 3. Divider line -->
      <div class="divider" aria-hidden="true"></div>

      <!-- 4. Broadcast message (can be closed) -->
      <div class="broadcast text-mono" id="broadcast" role="status"></div>

      <div class="app__main">
        <!-- 5. Page title, submissions badge and the code-freeze countdown -->
        <header class="page-header" id="pageHeader"></header>

        <!-- 6. The page that is currently open (live program, mentors, teams, admin...) -->
        <main class="page" id="pageMain">
          <div id="pageContent"></div>
        </main>
      </div>
    </div>

    <!-- 7. Floating Mini Q&A: a round bubble that opens into a panel -->
    <aside class="qa-float" id="qaFloat" aria-label="Mini Q&amp;A"></aside>

    <script src="script.js" defer></script>
  </body>
</html>
