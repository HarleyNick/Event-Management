<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Use the phone screen properly, including the areas near phone notches. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hackathon portal</title>

    <!-- These links download the fonts used on the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- This is the page's main stylesheet. -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body id="body">
    <!-- === APPLICATION SHELL === -->
    <!-- Most of the page is filled by script.js. -->

    <!-- JS: script.js puts the sidebar here. Do not remove the id or aria-label. -->
    <aside class="sidebar" id="sidebar" aria-label="Profile and settings"></aside>

    <!-- JS: this id keeps the main app together. -->
    <div class="app" id="app">
      <!-- === EVENT BANNER === -->
      <!-- JS: the banner is filled and moved here by script.js. -->
      <header class="banner" id="banner"></header>

      <!-- === MAIN NAVIGATION === -->
      <!-- JS: script.js adds the menu buttons here. Do not remove the id or aria-label. -->
      <nav class="top-nav" id="topNav" aria-label="Main menu"></nav>

      <!-- This line is only decoration. -->
      <div class="divider" aria-hidden="true"></div>

      <!-- JS/A11Y: script.js updates this status message. -->
      <div class="broadcast text-mono" id="broadcast" role="status"></div>

      <div class="app__main">
        <!-- === PAGE HEADER === -->
        <!-- JS: script.js puts the title and countdown here. -->
        <header class="page-header" id="pageHeader"></header>

        <!-- === ACTIVE PAGE CONTENT === -->
        <!-- JS: script.js changes the content in this main page area. -->
        <main class="page" id="pageMain">
          <div id="pageContent"></div>
        </main> <!-- /.page -->
      </div> <!-- /.app__main -->
    </div> <!-- /.app -->

    <!-- === FLOATING MINI Q&A === -->
    <!-- JS/A11Y: script.js controls this Q&A panel. Do not remove the id or aria-label. -->
    <aside class="qa-float" id="qaFloat" aria-label="Mini Q&amp;A"></aside> <!-- /.qa-float -->

    <script src="script.js" defer></script>
  </body> <!-- /body -->
</html> <!-- /html -->
